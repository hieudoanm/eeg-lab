<!doctype html>
<html lang="en" data-theme="neurolab">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · EEG Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-base-100: #ffffff;
        --color-base-200: #eef2f7;
        --color-base-300: #dce3ec;
        --color-base-content: #172033;
        --color-primary: #4059c7;
        --color-primary-content: #ffffff;
        --color-secondary: #5b6578;
        --color-accent: #4059c7;
        --color-info: #175cd3;
        --color-success: #18794e;
        --color-warning: #986500;
        --color-error: #b42318;
        --color-danger: #b42318;
        --color-background: #f6f8fb;
        --color-surface: #ffffff;
        --color-surface-muted: #eef2f7;
        --color-foreground: #172033;
        --color-muted-foreground: #5b6578;
        --color-border: #dce3ec;
      }
    </style>
    <style>
      [data-theme="neurolab"] {
        color-scheme: light;
        --color-base-100: #ffffff;
        --color-base-200: #eef2f7;
        --color-base-300: #dce3ec;
        --color-base-content: #172033;
        --color-primary: #4059c7;
        --color-primary-content: #ffffff;
        --color-secondary: #5b6578;
        --color-secondary-content: #ffffff;
        --color-accent: #4059c7;
        --color-accent-content: #ffffff;
        --color-neutral: #172033;
        --color-neutral-content: #ffffff;
        --color-info: #175cd3;
        --color-info-content: #ffffff;
        --color-success: #18794e;
        --color-success-content: #ffffff;
        --color-warning: #986500;
        --color-warning-content: #ffffff;
        --color-error: #b42318;
        --color-error-content: #ffffff;
        --radius-selector: 9999rem;
        --radius-field: 0.375rem;
        --radius-box: 0.625rem;
        --size-selector: 0.25rem;
        --size-field: 0.25rem;
        --border: 1px;
        --depth: 0;
        --noise: 0;
      }
      :root {
        --radius-card: 0.625rem;
      }
      body {
        background-color: #f6f8fb;
        color: #172033;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      :focus-visible {
        outline: 2px solid #4059c7;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="bg-background flex min-h-screen items-center justify-center px-4 py-12">
      <div class="w-full max-w-sm">
        <div class="mb-6 flex items-center gap-2">
          <span aria-hidden="true" class="bg-primary h-6 w-6 rounded"></span>
          <span class="text-base-content text-lg font-semibold tracking-tight">EEG Lab</span>
        </div>

        <div class="border-base-300 bg-base-100 rounded-[var(--radius-card)] border p-6">
          <h1 class="text-base-content text-xl font-semibold">Sign in</h1>
          <p class="text-base-content/60 mt-1 text-sm">
            Access your organisation&rsquo;s research workspace.
          </p>

          <form class="mt-6 flex flex-col gap-4" novalidate>
            <div class="flex flex-col gap-1.5">
              <label for="email" class="text-base-content text-sm font-medium">Email address</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                placeholder="researcher@example.org"
                class="input w-full disabled:cursor-not-allowed disabled:opacity-60" />
            </div>
            <button type="submit" class="btn btn-primary btn-md disabled:cursor-not-allowed disabled:opacity-50">
              Sign in
            </button>
          </form>

          <p class="text-base-content/60 mt-4 text-xs">
            This demonstration uses a passwordless development identity. Enter any email address to
            continue. Production deployments sign in through the organisation&rsquo;s identity
            provider.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
