[package]
name = "neurolab"
version = "0.1.0"
description = "NeuroLab - Neuroscience research platform for EEG studies, datasets, and descriptive analyses"
authors = ["NeuroLab Contributors"]
license = "MIT"
repository = "https://github.com/hieudoanm/neurolab"
edition = "2024"
rust-version = "1.90"

[lib]
name = "neurolab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
log = "=0.4.34"
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-shell = "=2.5.0"
tauri-plugin-fs = "=2.7.0"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-notification = "=2.6.0"
tokio = { version = "=1.53.2", features = ["full"] }
axum = "=0.8.9"
tower-http = { version = "=0.6.11", features = ["fs"] }
mime_guess = "=2.0.5"
