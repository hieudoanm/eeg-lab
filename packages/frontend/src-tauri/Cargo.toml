[package]
name = "neurolab"
version = "0.1.0"
description = "NeuroLab - Neuroscience research platform for EEG studies, datasets, and descriptive analyses"
authors = ["NeuroLab Contributors"]
license = "MIT"
repository = "https://github.com/hieudoanm/neurolab"
edition = "2024"
rust-version = "1.90"

[lib]
name = "neurolab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
mime_guess = "2.0"
