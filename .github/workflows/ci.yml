name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    env:
      UV_PYTHON: '3.14'
      DATABASE_URL: postgresql://neurolab:neurolab@localhost:5432/neurolab_test
      APP_ENV: test
      AUTH_MODE: development
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: neurolab
          POSTGRES_PASSWORD: neurolab
          POSTGRES_DB: neurolab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurolab -d neurolab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .

      - name: Apply migrations to a fresh database
        run: uv run python -m app.db.migrations upgrade

      - name: Pytest
        run: uv run pytest -q --cov=app --cov-report=term-missing

      - name: Python dependency audit (pip-audit)
        run: uv run pip-audit --desc --format=json --output=pip-audit.json || true
      - name: Upload pip-audit results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pip-audit-results
          path: packages/backend/pip-audit.json
          retention-days: 30

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      - name: Check frontend presence
        id: frontend
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.frontend.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.frontend.outputs.present == 'true'
        run: pnpm lint && pnpm format:check

      - name: Type check
        if: steps.frontend.outputs.present == 'true'
        run: pnpm typecheck

      - name: Unit tests
        if: steps.frontend.outputs.present == 'true'
        run: pnpm test

      - name: Build
        if: steps.frontend.outputs.present == 'true'
        run: pnpm build

      - name: Node dependency audit (npm audit)
        if: steps.frontend.outputs.present == 'true'
        run: pnpm audit --json --output=npm-audit.json || true
      - name: Upload npm audit results
        if: steps.frontend.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-audit-results
          path: packages/frontend/npm-audit.json
          retention-days: 30

  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: pnpm test:e2e

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: 'trivy-results.sarif'

  tauri-build:
    name: Build Tauri (${{ matrix.os }})
    needs: [backend, frontend, e2e, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: packages/frontend/.nvmrc

      - name: Enable pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || matrix.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workdir: packages/frontend/src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri application
        working-directory: packages/frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        run: |
          pnpm tauri:build

      - name: Zip App Bundle for macOS
        if: runner.os == 'macOS'
        working-directory: packages/frontend/src-tauri/target/release/bundle/macos
        run: |
          shopt -s nullglob
          for app in *.app; do
            zip -r -y "${app}.zip" "$app"
          done

      - name: Set Date
        id: date
        run: echo "value=$(date +'%Y_%m_%d')" >> "$GITHUB_OUTPUT"

      - name: Upload Tauri Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: neurolab_desktop_${{ matrix.os }}-${{ steps.date.outputs.value }}
          path: packages/frontend/src-tauri/target/release/bundle/

  tauri-release:
    name: Publish Tauri Release
    needs: [tauri-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Collect Release Artifacts
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            find "$dir" -type f \( \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.rpm" -o \
              -name "*.dmg" -o \
              -name "*.zip" -o \
              -name "*.tar.xz" -o \
              -name "*.msi" -o \
              -name "*.exe" \
            \) ! -name "*control.tar.gz" ! -name "*data.tar.gz" -print0 |
              while IFS= read -r -d '' file; do
                cp "$file" release/
              done
          done
          for file in release/*; do
            base="$(basename "$file")"
            ext="${base##*.}"
            target="neurolab.$ext"
            if [[ "$base" != "$target" ]]; then
              mv "$file" "release/$target"
            fi
          done
          cd release
          for file in ./*; do
            if [[ "$file" != "./SHA256SUMS.txt" ]]; then
              sha256sum --binary "${file#./}"
            fi
          done > SHA256SUMS.txt
          sha256sum --check --quiet SHA256SUMS.txt

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NAME="latest"
          RELEASE_TITLE="NeuroLab Latest"
          RELEASE_NOTES="release-notes.md"
          {
            echo "Auto-built from commit ${{ github.sha }}"
            echo ""
            echo "---"
            echo ""
            cat RELEASE.md
          } > "$RELEASE_NOTES"
          mapfile -d '' -t files < <(find release -type f -print0 | sort -z)
          gh release delete "$RELEASE_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_NAME" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RELEASE_NOTES" \
            "${files[@]}"
